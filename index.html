<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0}</style>
<title>给甜菜的yoyo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Inter:wght@400;500&display=swap">
<style>
  /* Layout: full-screen jewelry-showcase stage, caption top-left, finish switcher bottom-center. Single dark look by design. */
  :root {
    --stage: #0d0b08;
    --stage-glow: #2a2014;
    --ink: #f3e6c4;
    --ink-dim: #a8977010;
    --muted: #a89770;
    --gold: #e8b84a;
    --chip: rgba(255, 236, 190, 0.08);
    --chip-line: rgba(255, 220, 150, 0.22);
    --display: "Noto Serif SC", "Songti SC", "STSong", serif;
    --body: "Inter", -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 40%, var(--stage-glow), var(--stage) 70%);
    background-color: var(--stage);
    color: var(--ink);
    font-family: var(--body);
    overflow: hidden;
  }
  #stage { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #stage:active { cursor: grabbing; }
  .caption {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 24px);
    left: max(16px, env(safe-area-inset-left, 0px));
    padding-left: 8px;
    pointer-events: none;
    display: grid; gap: 6px;
  }
  .caption h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(28px, 5vw, 44px);
    letter-spacing: 0.06em;
    background: linear-gradient(180deg, #fff1c2 10%, #e8b84a 55%, #9a6b1c 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .caption .spec {
    font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .controls {
    position: fixed;
    left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
    display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
    max-width: calc(100% - 32px);
  }
  .controls button {
    font: 500 13px/1 var(--body);
    color: var(--ink);
    background: var(--chip);
    border: 1px solid var(--chip-line);
    border-radius: 999px;
    padding: 10px 16px;
    cursor: pointer;
    backdrop-filter: blur(8px);
    display: inline-flex; align-items: center; gap: 8px;
  }
  .controls button .dot { width: 10px; height: 10px; border-radius: 50%; }
  .controls button[aria-pressed="true"] { border-color: var(--gold); background: rgba(232, 184, 74, 0.18); }
  .controls button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .hint {
    position: fixed;
    right: max(16px, env(safe-area-inset-right, 0px));
    top: calc(env(safe-area-inset-top, 0px) + 30px);
    font-size: 12px; color: var(--muted); pointer-events: none;
  }
  @media (max-width: 520px) { .hint { display: none; } }
</style>

</head>
<body>
<canvas id="stage" aria-label="可旋转的 3D 黄金 YOYO 玩偶"></canvas>

<div class="caption">
  <h1>给甜菜的yoyo</h1>
  <div class="spec" id="spec">Au 999 · 足金 · 高 6.8 cm</div>
</div>
<div class="hint">拖动旋转 · 滚轮或双指缩放</div>

<div class="controls" role="group" aria-label="材质与动画">
  <button type="button" id="m-gold" data-metal="gold" aria-pressed="true"><span class="dot" style="background:#e8b84a"></span>足金</button>
  <button type="button" id="m-rose" data-metal="rose" aria-pressed="false"><span class="dot" style="background:#e3a28a"></span>玫瑰金</button>
  <button type="button" id="m-plat" data-metal="plat" aria-pressed="false"><span class="dot" style="background:#d9dde3"></span>铂金</button>
  <button type="button" id="spin" aria-pressed="true">自动旋转</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  const canvas = document.getElementById('stage');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
  camera.position.set(0, 2.6, 8.5);

  const controls = new THREE.OrbitControls(camera, canvas);
  controls.target.set(0, 1.55, 0);
  controls.enableDamping = true;
  controls.enablePan = false;
  controls.minDistance = 4.5;
  controls.maxDistance = 13;
  controls.minPolarAngle = 0.35;
  controls.maxPolarAngle = 1.62;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  controls.autoRotate = !reduceMotion;
  controls.autoRotateSpeed = 1.6;

  // ---- Studio environment for metal reflections (built in code, no external HDR) ----
  const pmrem = new THREE.PMREMGenerator(renderer);
  const envScene = new THREE.Scene();
  const envGeo = new THREE.SphereGeometry(20, 48, 24);
  const colors = [];
  const pos = envGeo.attributes.position;
  const top = new THREE.Color(0.55, 0.45, 0.32), mid = new THREE.Color(0.08, 0.06, 0.04), bot = new THREE.Color(0.02, 0.015, 0.01);
  for (let i = 0; i < pos.count; i++) {
    const t = pos.getY(i) / 20;
    const c = t > 0 ? mid.clone().lerp(top, t) : mid.clone().lerp(bot, -t);
    colors.push(c.r, c.g, c.b);
  }
  envGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  envScene.add(new THREE.Mesh(envGeo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
  function softbox(w, h, x, y, z, intensity) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(intensity, intensity * 0.95, intensity * 0.85), side: THREE.DoubleSide }));
    m.position.set(x, y, z); m.lookAt(0, 0, 0); envScene.add(m);
  }
  softbox(10, 4, 0, 12, 6, 6);
  softbox(4, 10, -12, 3, 4, 3.5);
  softbox(4, 10, 12, 4, -2, 2.5);
  softbox(8, 2, 0, -2, -14, 1.5);
  scene.environment = pmrem.fromScene(envScene, 0.04).texture;

  // ---- Lights ----
  const key = new THREE.DirectionalLight(0xfff0d0, 2.2);
  key.position.set(3, 7, 5);
  key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024);
  key.shadow.camera.left = -3; key.shadow.camera.right = 3; key.shadow.camera.top = 4; key.shadow.camera.bottom = -2;
  key.shadow.radius = 6;
  scene.add(key);
  const rim = new THREE.DirectionalLight(0xffd59a, 1.4);
  rim.position.set(-4, 3, -5);
  scene.add(rim);
  scene.add(new THREE.AmbientLight(0x3a2c18, 0.6));

  // ---- Materials ----
  const METALS = {
    gold: { body: 0xf2c14e, accent: 0xd98c5f, label: 'Au 999 · 足金 · 高 6.8 cm' },
    rose: { body: 0xe8a98f, accent: 0xf2c14e, label: 'Au 750 · 玫瑰金 · 高 6.8 cm' },
    plat: { body: 0xdfe3e8, accent: 0xf2c14e, label: 'Pt 950 · 铂金 · 高 6.8 cm' }
  };
  const metal = new THREE.MeshStandardMaterial({ color: METALS.gold.body, metalness: 1, roughness: 0.22, envMapIntensity: 1.25 });
  const satin = new THREE.MeshStandardMaterial({ color: METALS.gold.body, metalness: 1, roughness: 0.48, envMapIntensity: 1.1 });
  const accent = new THREE.MeshStandardMaterial({ color: METALS.gold.accent, metalness: 1, roughness: 0.3 });
  const onyx = new THREE.MeshStandardMaterial({ color: 0x0a0806, metalness: 0.2, roughness: 0.08, envMapIntensity: 1.6 });
  const pedestalMat = new THREE.MeshStandardMaterial({ color: 0x15110c, metalness: 0.4, roughness: 0.35 });

  function mesh(geo, mat, x, y, z, sx, sy, sz) {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x, y, z);
    if (sx) m.scale.set(sx, sy, sz);
    m.castShadow = true; m.receiveShadow = true;
    return m;
  }
  const sphere = (r) => new THREE.SphereGeometry(r, 64, 48);

  // ---- Figure (an original chibi design) ----
  const doll = new THREE.Group();

  // Body: pear-shaped lathe
  const bodyPts = [];
  for (let i = 0; i <= 24; i++) {
    const t = i / 24, y = t * 1.15;
    const r = 0.08 + 0.62 * Math.sin(Math.PI * (0.12 + 0.88 * t)) * (1 - 0.35 * t);
    bodyPts.push(new THREE.Vector2(Math.max(r, 0.01), y));
  }
  bodyPts[0].x = 0.001;
  const body = mesh(new THREE.LatheGeometry(bodyPts, 64), metal, 0, 0.12, 0);
  doll.add(body);
  // Belly medallion
  const belly = mesh(sphere(0.34), satin, 0, 0.6, 0.48, 1, 1.05, 0.35);
  doll.add(belly);
  // Feet
  doll.add(mesh(sphere(0.26), metal, -0.3, 0.12, 0.12, 1, 0.62, 1.3));
  doll.add(mesh(sphere(0.26), metal, 0.3, 0.12, 0.12, 1, 0.62, 1.3));
  // Arms
  const armL = mesh(sphere(0.24), metal, -0.66, 0.72, 0.08, 0.62, 1.05, 0.62); armL.rotation.z = -0.55;
  const armR = mesh(sphere(0.24), metal, 0.66, 0.72, 0.08, 0.62, 1.05, 0.62); armR.rotation.z = 0.55;
  doll.add(armL, armR);

  // Head
  const head = new THREE.Group();
  head.position.set(0, 1.95, 0);
  head.add(mesh(sphere(1), metal, 0, 0, 0, 1.15, 0.98, 1.04));
  // Ears with recessed satin inner
  [-1, 1].forEach((s) => {
    const ear = mesh(sphere(0.33), metal, s * 0.78, 0.74, -0.05, 1, 1, 0.75);
    const inner = mesh(sphere(0.2), accent, s * 0.8, 0.76, 0.17, 1, 1, 0.35);
    head.add(ear, inner);
  });
  // Eyes: polished onyx with a gold catchlight
  [-1, 1].forEach((s) => {
    head.add(mesh(sphere(0.13), onyx, s * 0.36, -0.06, 0.93, 1, 1.15, 0.55));
    head.add(mesh(sphere(0.035), metal, s * 0.36 + 0.04, -0.01, 1.0));
    // Blush
    head.add(mesh(sphere(0.15), accent, s * 0.62, -0.3, 0.76, 1, 0.6, 0.3));
  });
  // Nose + smile
  head.add(mesh(sphere(0.07), accent, 0, -0.22, 1.01, 1.3, 0.9, 0.8));
  const smile = mesh(new THREE.TorusGeometry(0.11, 0.022, 16, 48, Math.PI), satin, 0, -0.32, 0.975);
  smile.rotation.z = Math.PI;
  head.add(smile);
  // Little crown tuft
  const tuft = mesh(new THREE.ConeGeometry(0.12, 0.3, 32), metal, 0.05, 1.02, 0.1);
  tuft.rotation.z = -0.35;
  head.add(tuft);
  doll.add(head);

  doll.position.y = 0.3;
  scene.add(doll);

  // ---- Pedestal ----
  const pedestal = new THREE.Group();
  const base = mesh(new THREE.CylinderGeometry(1.45, 1.6, 0.3, 96), pedestalMat, 0, 0.15, 0);
  const ring = mesh(new THREE.TorusGeometry(1.46, 0.035, 16, 128), metal, 0, 0.3, 0);
  ring.rotation.x = Math.PI / 2;
  const ring2 = mesh(new THREE.TorusGeometry(1.6, 0.025, 16, 128), satin, 0, 0.0, 0);
  ring2.rotation.x = Math.PI / 2;
  pedestal.add(base, ring, ring2);
  scene.add(pedestal);

  // Soft floor glow
  const glowCanvas = document.createElement('canvas');
  glowCanvas.width = glowCanvas.height = 256;
  const g = glowCanvas.getContext('2d');
  const grad = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  grad.addColorStop(0, 'rgba(255,200,110,0.35)');
  grad.addColorStop(1, 'rgba(255,200,110,0)');
  g.fillStyle = grad; g.fillRect(0, 0, 256, 256);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(9, 9), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(glowCanvas), transparent: true, depthWrite: false }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = -0.01;
  scene.add(floor);

  // ---- Sparkles ----
  const starCanvas = document.createElement('canvas');
  starCanvas.width = starCanvas.height = 64;
  const sc = starCanvas.getContext('2d');
  const sg = sc.createRadialGradient(32, 32, 0, 32, 32, 32);
  sg.addColorStop(0, 'rgba(255,245,210,1)'); sg.addColorStop(0.25, 'rgba(255,215,130,0.6)'); sg.addColorStop(1, 'rgba(255,200,100,0)');
  sc.fillStyle = sg; sc.fillRect(0, 0, 64, 64);
  sc.fillStyle = 'rgba(255,250,230,0.9)';
  sc.fillRect(31, 4, 2, 56); sc.fillRect(4, 31, 56, 2);
  const N = 70, sp = new Float32Array(N * 3), seeds = [];
  for (let i = 0; i < N; i++) {
    const a = Math.random() * Math.PI * 2, r = 1.6 + Math.random() * 2.4;
    sp[i * 3] = Math.cos(a) * r; sp[i * 3 + 1] = Math.random() * 4.2; sp[i * 3 + 2] = Math.sin(a) * r;
    seeds.push(Math.random() * 10);
  }
  const sparkGeo = new THREE.BufferGeometry();
  sparkGeo.setAttribute('position', new THREE.BufferAttribute(sp, 3));
  const sparks = new THREE.Points(sparkGeo, new THREE.PointsMaterial({ size: 0.16, map: new THREE.CanvasTexture(starCanvas), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
  scene.add(sparks);

  // ---- UI ----
  const metalButtons = document.querySelectorAll('[data-metal]');
  const spec = document.getElementById('spec');
  metalButtons.forEach((b) => b.addEventListener('click', () => {
    const m = METALS[b.dataset.metal];
    metal.color.setHex(m.body); satin.color.setHex(m.body); accent.color.setHex(m.accent);
    spec.textContent = m.label;
    metalButtons.forEach((o) => o.setAttribute('aria-pressed', String(o === b)));
  }));
  const spinBtn = document.getElementById('spin');
  spinBtn.setAttribute('aria-pressed', String(controls.autoRotate));
  spinBtn.addEventListener('click', () => {
    controls.autoRotate = !controls.autoRotate;
    spinBtn.setAttribute('aria-pressed', String(controls.autoRotate));
  });

  // ---- Resize + loop ----
  function resize() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.position.setLength(w / h < 0.8 ? 11 : 8.9);
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  const clock = new THREE.Clock();
  function tick() {
    const t = clock.getElapsedTime();
    if (!reduceMotion) {
      doll.position.y = 0.3 + Math.sin(t * 1.6) * 0.04;
      head.rotation.z = Math.sin(t * 0.9) * 0.05;
      armL.rotation.z = -0.55 - Math.sin(t * 2.2) * 0.12;
      armR.rotation.z = 0.55 + Math.sin(t * 2.2 + 1) * 0.12;
      const p = sparkGeo.attributes.position;
      for (let i = 0; i < N; i++) {
        let y = p.getY(i) + 0.004;
        if (y > 4.4) y = 0.2;
        p.setY(i, y);
      }
      p.needsUpdate = true;
      sparks.material.opacity = 0.7 + Math.sin(t * 3) * 0.3;
      sparks.rotation.y = t * 0.05;
    }
    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>

</body>
</html>
