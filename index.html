<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0}</style>
<title>给甜菜的yoyo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Inter:wght@400;500&display=swap">
<style>
  /* Layout: full-screen jewelry-showcase stage, caption top-left, finish switcher bottom-center. Single dark look by design. */
  :root {
    --stage: #0d0b08;
    --stage-glow: #2a2014;
    --ink: #f3e6c4;
    --ink-dim: #a8977010;
    --muted: #a89770;
    --gold: #e8b84a;
    --chip: rgba(255, 236, 190, 0.08);
    --chip-line: rgba(255, 220, 150, 0.22);
    --display: "Noto Serif SC", "Songti SC", "STSong", serif;
    --body: "Inter", -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 40%, var(--stage-glow), var(--stage) 70%);
    background-color: var(--stage);
    color: var(--ink);
    font-family: var(--body);
    overflow: hidden;
  }
  #stage { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #stage:active { cursor: grabbing; }
  .caption {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 24px);
    left: max(16px, env(safe-area-inset-left, 0px));
    padding-left: 8px;
    pointer-events: none;
    display: grid; gap: 6px;
  }
  .caption h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(28px, 5vw, 44px);
    letter-spacing: 0.06em;
    background: linear-gradient(180deg, #fff1c2 10%, #e8b84a 55%, #9a6b1c 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .caption .spec {
    font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .controls {
    position: fixed;
    left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
    display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
    max-width: calc(100% - 32px);
  }
  .controls button {
    font: 500 13px/1 var(--body);
    color: var(--ink);
    background: var(--chip);
    border: 1px solid var(--chip-line);
    border-radius: 999px;
    padding: 10px 16px;
    cursor: pointer;
    backdrop-filter: blur(8px);
    display: inline-flex; align-items: center; gap: 8px;
  }
  .controls button .dot { width: 10px; height: 10px; border-radius: 50%; }
  .controls button[aria-pressed="true"] { border-color: var(--gold); background: rgba(232, 184, 74, 0.18); }
  .controls button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .hint {
    position: fixed;
    right: max(16px, env(safe-area-inset-right, 0px));
    top: calc(env(safe-area-inset-top, 0px) + 30px);
    font-size: 12px; color: var(--muted); pointer-events: none;
  }
  @media (max-width: 520px) { .hint { display: none; } }
</style>

</head>
<body>
<canvas id="stage" aria-label="可旋转的 3D 黄金 yoyo 小女孩玩偶"></canvas>

<div class="caption">
  <h1>给甜菜的yoyo</h1>
  <div class="spec" id="spec">Au 999 · 足金 · 高 6.8 cm</div>
</div>
<div class="hint">拖动旋转 · 滚轮或双指缩放</div>

<div class="controls" role="group" aria-label="材质与动画">
  <button type="button" id="m-gold" data-metal="gold" aria-pressed="true"><span class="dot" style="background:#e8b84a"></span>足金</button>
  <button type="button" id="m-rose" data-metal="rose" aria-pressed="false"><span class="dot" style="background:#e3a28a"></span>玫瑰金</button>
  <button type="button" id="m-plat" data-metal="plat" aria-pressed="false"><span class="dot" style="background:#d9dde3"></span>铂金</button>
  <button type="button" id="spin" aria-pressed="true">自动旋转</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  const canvas = document.getElementById('stage');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
  camera.position.set(0, 2.6, 8.5);

  const controls = new THREE.OrbitControls(camera, canvas);
  controls.target.set(0, 1.55, 0);
  controls.enableDamping = true;
  controls.enablePan = false;
  controls.minDistance = 4.5;
  controls.maxDistance = 13;
  controls.minPolarAngle = 0.35;
  controls.maxPolarAngle = 1.62;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  controls.autoRotate = !reduceMotion;
  controls.autoRotateSpeed = 1.6;

  // ---- Studio environment for metal reflections (built in code, no external HDR) ----
  const pmrem = new THREE.PMREMGenerator(renderer);
  const envScene = new THREE.Scene();
  const envGeo = new THREE.SphereGeometry(20, 48, 24);
  const colors = [];
  const pos = envGeo.attributes.position;
  const top = new THREE.Color(0.55, 0.45, 0.32), mid = new THREE.Color(0.08, 0.06, 0.04), bot = new THREE.Color(0.02, 0.015, 0.01);
  for (let i = 0; i < pos.count; i++) {
    const t = pos.getY(i) / 20;
    const c = t > 0 ? mid.clone().lerp(top, t) : mid.clone().lerp(bot, -t);
    colors.push(c.r, c.g, c.b);
  }
  envGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  envScene.add(new THREE.Mesh(envGeo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
  function softbox(w, h, x, y, z, intensity) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(intensity, intensity * 0.95, intensity * 0.85), side: THREE.DoubleSide }));
    m.position.set(x, y, z); m.lookAt(0, 0, 0); envScene.add(m);
  }
  softbox(10, 4, 0, 12, 6, 6);
  softbox(4, 10, -12, 3, 4, 3.5);
  softbox(4, 10, 12, 4, -2, 2.5);
  softbox(8, 2, 0, -2, -14, 1.5);
  scene.environment = pmrem.fromScene(envScene, 0.04).texture;

  // ---- Lights ----
  const key = new THREE.DirectionalLight(0xfff0d0, 2.2);
  key.position.set(3, 7, 5);
  key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024);
  key.shadow.camera.left = -3; key.shadow.camera.right = 3; key.shadow.camera.top = 4; key.shadow.camera.bottom = -2;
  key.shadow.radius = 6;
  scene.add(key);
  const rim = new THREE.DirectionalLight(0xffd59a, 1.4);
  rim.position.set(-4, 3, -5);
  scene.add(rim);
  scene.add(new THREE.AmbientLight(0x3a2c18, 0.6));

  // ---- Materials ----
  const METALS = {
    gold: { body: 0xf2c14e, accent: 0xd98c5f, ink: 0xfff1d0, label: 'Au 999 · 足金 · 高 6.8 cm' },
    rose: { body: 0xe8a98f, accent: 0xf2c14e, ink: 0xfff4ea, label: 'Au 750 · 玫瑰金 · 高 6.8 cm' },
    plat: { body: 0xdfe3e8, accent: 0xf2c14e, ink: 0xf2c14e, label: 'Pt 950 · 铂金 · 高 6.8 cm' }
  };
  let currentMetal = METALS.gold;
  const metal = new THREE.MeshStandardMaterial({ color: METALS.gold.body, metalness: 1, roughness: 0.22, envMapIntensity: 1.25 });
  const satin = new THREE.MeshStandardMaterial({ color: METALS.gold.body, metalness: 1, roughness: 0.48, envMapIntensity: 1.1 });
  const accent = new THREE.MeshStandardMaterial({ color: METALS.gold.accent, metalness: 1, roughness: 0.3 });
  const onyx = new THREE.MeshStandardMaterial({ color: 0x0a0806, metalness: 0.2, roughness: 0.08, envMapIntensity: 1.6 });
  const pedestalMat = new THREE.MeshStandardMaterial({ color: 0x15110c, metalness: 0.4, roughness: 0.35 });

  function mesh(geo, mat, x, y, z, sx, sy, sz) {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x, y, z);
    if (sx) m.scale.set(sx, sy, sz);
    m.castShadow = true; m.receiveShadow = true;
    return m;
  }
  const sphere = (r) => new THREE.SphereGeometry(r, 64, 48);

  // ---- Figure: modeled on the reference photos (bowl-cut pumpkin hair, rounded-square face, oval eyes, freckles, YOYO dress) ----
  const doll = new THREE.Group();
  const skin = new THREE.MeshStandardMaterial({ color: METALS.gold.body, metalness: 1, roughness: 0.42, envMapIntensity: 1.15 });
  const blushMat = new THREE.MeshStandardMaterial({ color: 0xf6b49a, metalness: 0.85, roughness: 0.35 });
  const sleeveMat = new THREE.MeshStandardMaterial({ color: METALS.gold.body, metalness: 1, roughness: 0.34, envMapIntensity: 1.2 });

  // Superellipsoid helper: rounded-box shapes from a sphere
  function roundedBox(hx, hy, hz, n, seg, warp) {
    const geo = new THREE.SphereGeometry(1, seg, Math.round(seg * 0.75));
    const p = geo.attributes.position, d = new THREE.Vector3();
    for (let i = 0; i < p.count; i++) {
      d.fromBufferAttribute(p, i).normalize();
      const s = Math.pow(Math.pow(Math.abs(d.x), n) + Math.pow(Math.abs(d.y), n) + Math.pow(Math.abs(d.z), n), 1 / n);
      let x = d.x / s, y = d.y / s, z = d.z / s;
      if (warp) { const r = warp(x, y, z, d); x *= r; y *= r; z *= r; }
      p.setXYZ(i, x * hx, y * hy, z * hz);
    }
    geo.computeVertexNormals();
    return geo;
  }
  const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

  // Legs, socks, Mary Jane shoes
  [-1, 1].forEach((s) => {
    const leg = mesh(new THREE.CylinderGeometry(0.12, 0.13, 0.42, 32), skin, s * 0.27, 0.32, 0);
    leg.rotation.z = -s * 0.12;
    const sock = mesh(new THREE.CylinderGeometry(0.14, 0.145, 0.16, 32), accent, s * 0.3, 0.17, 0);
    sock.rotation.z = -s * 0.12;
    const shoe = mesh(sphere(0.2), onyx, s * 0.32, 0.08, 0.07, 0.95, 0.5, 1.35);
    doll.add(leg, sock, shoe);
  });

  // Oversized trapezoid dress with a wavy hem and YOYO lettering
  const dressCanvas = document.createElement('canvas');
  dressCanvas.width = 1024; dressCanvas.height = 512;
  const dressTex = new THREE.CanvasTexture(dressCanvas);
  dressTex.encoding = THREE.sRGBEncoding;
  dressTex.anisotropy = 8;
  function paintDress(bg, ink) {
    const c = dressCanvas.getContext('2d');
    c.fillStyle = bg; c.fillRect(0, 0, 1024, 512);
    c.fillStyle = ink;
    c.font = '700 78px "Inter", "Helvetica Neue", Arial, sans-serif';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.save(); c.translate(512, 215); c.rotate(0.12); c.fillText('YOYO', 0, 0); c.restore();
    dressTex.needsUpdate = true;
  }
  const hex = (n) => '#' + n.toString(16).padStart(6, '0');
  const dressMat = new THREE.MeshStandardMaterial({ color: 0xffffff, map: dressTex, metalness: 1, roughness: 0.32, envMapIntensity: 1.2 });
  const dressPts = [];
  for (let i = 0; i <= 30; i++) {
    const t = i / 30;
    dressPts.push(new THREE.Vector2(0.95 - 0.5 * Math.pow(t, 0.9) - 0.06 * Math.sin(Math.PI * t), 0.48 + t * 0.84));
  }
  dressPts.push(new THREE.Vector2(0.001, 1.32));
  const dressGeo = new THREE.LatheGeometry(dressPts, 96, -Math.PI, Math.PI * 2);
  const dp = dressGeo.attributes.position;
  for (let i = 0; i < dp.count; i++) {
    const y = dp.getY(i);
    if (y < 0.6) {
      const ang = Math.atan2(dp.getX(i), dp.getZ(i));
      dp.setY(i, y + 0.045 * Math.sin(ang * 5) * (0.6 - y) / 0.12);
    }
  }
  dressGeo.computeVertexNormals();
  const dress = mesh(dressGeo, dressMat, 0, 0, 0, 1, 1, 0.82);
  doll.add(dress);

  // Arms out to the sides: flared sleeves, open hands with spread fingers
  function makeArm(s) {
    const arm = new THREE.Group();
    arm.position.set(s * 0.4, 1.2, 0.02);
    const sleeve = mesh(new THREE.CylinderGeometry(0.15, 0.24, 0.56, 32), sleeveMat, 0, -0.28, 0);
    const hand = new THREE.Group();
    hand.position.set(0, -0.66, 0);
    hand.add(mesh(sphere(0.1), skin, 0, 0, 0, 1, 1.05, 0.62));
    for (let f = 0; f < 4; f++) {
      const a = (f - 1.5) * 0.32;
      const fing = mesh(new THREE.CylinderGeometry(0.026, 0.03, 0.15, 12), skin, Math.sin(a) * 0.12, -Math.cos(a) * 0.12, 0);
      fing.rotation.z = a;
      fing.add(mesh(sphere(0.027), skin, 0, -0.075, 0));
      hand.add(fing);
    }
    const thumb = mesh(new THREE.CylinderGeometry(0.03, 0.034, 0.12, 12), skin, -s * 0.1, -0.02, 0.03);
    thumb.rotation.z = -s * 1.1;
    hand.add(thumb);
    arm.add(sleeve, hand);
    arm.rotation.z = s * 1.15;
    return arm;
  }
  const armL = makeArm(-1), armR = makeArm(1);
  doll.add(armL, armR);

  // Head
  const head = new THREE.Group();
  head.position.set(0, 2.05, 0);
  // Rounded-square face, a little wider at the cheeks
  const F = { cy: -0.15, cz: 0.2, hx: 0.76, hy: 0.66, hz: 0.7 };
  const faceGeo = roundedBox(F.hx, F.hy, F.hz, 3, 96);
  const fp = faceGeo.attributes.position;
  for (let i = 0; i < fp.count; i++) fp.setX(i, fp.getX(i) * (1 + 0.1 * Math.max(0, -fp.getY(i) / F.hy)));
  faceGeo.computeVertexNormals();
  head.add(mesh(faceGeo, skin, 0, F.cy, F.cz));
  // Surface depth of the face at (x, y) in head coordinates, to seat the features
  function faceZ(x, y) {
    const yl = (y - F.cy) / F.hy;
    const xl = x / (F.hx * (1 + 0.1 * Math.max(0, -yl)));
    return F.cz + F.hz * Math.cbrt(Math.max(0, 1 - Math.abs(xl) ** 3 - Math.abs(yl) ** 3));
  }
  // Bowl-cut pumpkin hair: boxy helmet with soft lobes and a straight fringe; opening at the front for the face
  const hairGeo = roundedBox(1.02, 0.92, 1.0, 2.6, 160, (x, y, z, d) => {
    const ang = Math.atan2(d.x, d.z);
    const lobe = 1 + 0.035 * Math.abs(Math.cos(ang * 3.5)) * smooth(-0.6, 0.4, d.y);
    const open = smooth(0.42, 0.62, d.z) * smooth(0.12, -0.08, d.y);
    return lobe * (1 - 0.45 * open);
  });
  head.add(mesh(hairGeo, metal, 0, 0.12, -0.02));
  // Stem
  const stemCurve = new THREE.CatmullRomCurve3([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0.04, 0.16, -0.02), new THREE.Vector3(0.14, 0.26, -0.04)]);
  head.add(mesh(new THREE.TubeGeometry(stemCurve, 20, 0.05, 12), onyx, 0.32, 0.98, -0.15));
  // Big oval eyes, freckles, blush; no mouth
  [-1, 1].forEach((s) => {
    const ex = s * 0.33, ey = -0.17;
    head.add(mesh(sphere(0.13), onyx, ex, ey, faceZ(ex, ey) - 0.025, 0.82, 1.05, 0.4));
    head.add(mesh(sphere(0.022), metal, ex + 0.04, ey + 0.06, faceZ(ex, ey) + 0.03));
    const bx = s * 0.47, by = -0.45;
    head.add(mesh(sphere(0.12), blushMat, bx, by, faceZ(bx, by) - 0.03, 1, 0.7, 0.28));
    [[-0.045, 0.03], [0.04, 0.035], [0, -0.035]].forEach(([dx, dy]) => {
      const fx = bx + s * dx, fy = by + dy;
      head.add(mesh(sphere(0.013), onyx, fx, fy, faceZ(fx, fy) + 0.004));
    });
  });
  head.rotation.z = 0.22;
  doll.add(head);

  function applyMetal(m) {
    metal.color.setHex(m.body); skin.color.setHex(m.body); sleeveMat.color.setHex(m.body);
    satin.color.setHex(m.body); accent.color.setHex(m.accent);
    paintDress(hex(m.body), hex(m.ink));
  }
  applyMetal(METALS.gold);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => applyMetal(currentMetal));

  doll.position.y = 0.33;
  scene.add(doll);

  // ---- Pedestal ----
  const pedestal = new THREE.Group();
  const base = mesh(new THREE.CylinderGeometry(1.45, 1.6, 0.3, 96), pedestalMat, 0, 0.15, 0);
  const ring = mesh(new THREE.TorusGeometry(1.46, 0.035, 16, 128), metal, 0, 0.3, 0);
  ring.rotation.x = Math.PI / 2;
  const ring2 = mesh(new THREE.TorusGeometry(1.6, 0.025, 16, 128), satin, 0, 0.0, 0);
  ring2.rotation.x = Math.PI / 2;
  pedestal.add(base, ring, ring2);
  scene.add(pedestal);

  // Soft floor glow
  const glowCanvas = document.createElement('canvas');
  glowCanvas.width = glowCanvas.height = 256;
  const g = glowCanvas.getContext('2d');
  const grad = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  grad.addColorStop(0, 'rgba(255,200,110,0.35)');
  grad.addColorStop(1, 'rgba(255,200,110,0)');
  g.fillStyle = grad; g.fillRect(0, 0, 256, 256);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(9, 9), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(glowCanvas), transparent: true, depthWrite: false }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = -0.01;
  scene.add(floor);

  // ---- Sparkles ----
  const starCanvas = document.createElement('canvas');
  starCanvas.width = starCanvas.height = 64;
  const sc = starCanvas.getContext('2d');
  const sg = sc.createRadialGradient(32, 32, 0, 32, 32, 32);
  sg.addColorStop(0, 'rgba(255,245,210,1)'); sg.addColorStop(0.25, 'rgba(255,215,130,0.6)'); sg.addColorStop(1, 'rgba(255,200,100,0)');
  sc.fillStyle = sg; sc.fillRect(0, 0, 64, 64);
  sc.fillStyle = 'rgba(255,250,230,0.9)';
  sc.fillRect(31, 4, 2, 56); sc.fillRect(4, 31, 56, 2);
  const N = 70, sp = new Float32Array(N * 3), seeds = [];
  for (let i = 0; i < N; i++) {
    const a = Math.random() * Math.PI * 2, r = 1.6 + Math.random() * 2.4;
    sp[i * 3] = Math.cos(a) * r; sp[i * 3 + 1] = Math.random() * 4.2; sp[i * 3 + 2] = Math.sin(a) * r;
    seeds.push(Math.random() * 10);
  }
  const sparkGeo = new THREE.BufferGeometry();
  sparkGeo.setAttribute('position', new THREE.BufferAttribute(sp, 3));
  const sparks = new THREE.Points(sparkGeo, new THREE.PointsMaterial({ size: 0.16, map: new THREE.CanvasTexture(starCanvas), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
  scene.add(sparks);

  // ---- UI ----
  const metalButtons = document.querySelectorAll('[data-metal]');
  const spec = document.getElementById('spec');
  metalButtons.forEach((b) => b.addEventListener('click', () => {
    const m = METALS[b.dataset.metal];
    currentMetal = m; applyMetal(m);
    spec.textContent = m.label;
    metalButtons.forEach((o) => o.setAttribute('aria-pressed', String(o === b)));
  }));
  const spinBtn = document.getElementById('spin');
  spinBtn.setAttribute('aria-pressed', String(controls.autoRotate));
  spinBtn.addEventListener('click', () => {
    controls.autoRotate = !controls.autoRotate;
    spinBtn.setAttribute('aria-pressed', String(controls.autoRotate));
  });

  // ---- Resize + loop ----
  function resize() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.position.setLength(w / h < 0.8 ? 11 : 8.9);
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  const clock = new THREE.Clock();
  function tick() {
    const t = clock.getElapsedTime();
    if (!reduceMotion) {
      doll.position.y = 0.3 + Math.sin(t * 1.6) * 0.04;
      head.rotation.z = 0.22 + Math.sin(t * 0.9) * 0.035;
      armL.rotation.z = -1.15 - Math.sin(t * 2.0) * 0.08;
      armR.rotation.z = 1.15 + Math.sin(t * 2.0 + 1.2) * 0.08;
      const p = sparkGeo.attributes.position;
      for (let i = 0; i < N; i++) {
        let y = p.getY(i) + 0.004;
        if (y > 4.4) y = 0.2;
        p.setY(i, y);
      }
      p.needsUpdate = true;
      sparks.material.opacity = 0.7 + Math.sin(t * 3) * 0.3;
      sparks.rotation.y = t * 0.05;
    }
    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>

</body>
</html>
